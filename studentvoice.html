</style></head><body><div id="root"></div><script>import "./styles.css";

const districts = ["Thiruvananthapuram", "Kollam", "Pathanamthitta", "Alappuzha", "Kottayam", "Idukki", "Ernakulam", "Thrissur", "Palakkad", "Malappuram", "Kozhikode", "Wayanad", "Kannur", "Kasaragod"];
const categories = [
  { key: "safety", label: "Student safety", icon: "shield", copy: "Bullying, harassment, discrimination or unsafe spaces." },
  { key: "wellbeing", label: "Mental well-being", icon: "heart", copy: "A private first step when school feels overwhelming." },
  { key: "education", label: "Education", icon: "book", copy: "Learning access, teaching support and student needs." },

];

const sampleReports = [
  { ref: "SV-CASE-4821", title: "Accessible ramp needs attention", category: "Community issues", district: "Ernakulam", urgency: "Medium", status: "Investigation in Progress", date: "Oct 24, 2026", description: "A sample report about access around a school assembly hall.", notes: "Facilities team review requested. Demonstration note only.", action: "Site walk-through scheduled" },
  { ref: "SV-CASE-3174", title: "Repeated teasing in shared corridor", category: "Student safety", district: "Kozhikode", urgency: "High", status: "Under Review", date: "Oct 27, 2026", description: "A sample report about peer behaviour during a transition period.", notes: "Keep follow-up discreet; speak with safeguarding lead.", action: "" },
  { ref: "SV-CASE-1098", title: "Quiet study space request", category: "Mental well-being", district: "Kottayam", urgency: "Low", status: "Action Taken", date: "Oct 16, 2026", description: "A sample request for a calmer space during lunch break.", notes: "Demo case. No personal data attached.", action: "Pilot space opened for two weeks" },
  { ref: "SV-CASE-7742", title: "Learning materials not available", category: "Education", district: "Palakkad", urgency: "Medium", status: "Submitted", date: "Oct 29, 2026", description: "A sample report about shared classroom resources.", notes: "Awaiting first review.", action: "" },
];

const app = document.querySelector("#root");
const state = {
  view: window.location.pathname === "/student" ? "student" : window.location.pathname === "/agency" ? "agency" : window.location.pathname === "/privacy" ? "privacy" : "home",
  loggedIn: false,
  agencyLoggedIn: false,
  studentReports: [
    { ref: "SV-CASE-5512", title: "Study room access", category: "Education", district: "Alappuzha", urgency: "Low", status: "Action Taken", date: "Oct 26, 2026", description: "Sample report record.", notes: "", action: "Quiet study slot added" },
    { ref: "SV-CASE-4880", title: "Need a safer pickup point", category: "Student safety", district: "Ernakulam", urgency: "High", status: "Under Review", date: "Oct 28, 2026", description: "Sample report record.", notes: "", action: "" },
  ],
  selectedAgencyRef: "SV-CASE-3174",
  agencyFilters: { search: "", district: "All districts", category: "All categories", urgency: "All urgency", status: "All statuses" },
  studentAccount: null,
  agencyReports: [],
};
const allReports = () => [...new Map([...sampleReports, ...state.studentReports, ...state.agencyReports].map(report => [report.ref, report])).values()];

const icon = (name, size = 20) => {
  const paths = { shield: '<path d="M12 3 5 6v5c0 4.2 2.9 7.1 7 9 4.1-1.9 7-4.8 7-9V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>', heart: '<path d="M20.8 8.8c0 5-8.8 9.7-8.8 9.7S3.2 13.8 3.2 8.8A4.7 4.7 0 0 1 12 6.4a4.7 4.7 0 0 1 8.8 2.4Z"/>', book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 18h16M8 7h7"/>', people: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 20c.4-3.6 2.2-5.4 6-5.4s5.6 1.8 6 5.4M15 14.2c3 .2 4.5 1.7 5 4.8"/>', arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', lock: '<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>', check: '<path d="m5 12 4 4L19 6"/>', menu: '<path d="M4 6h16M4 12h16M4 18h16"/>', close: '<path d="m6 6 12 12M18 6 6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>', filter: '<path d="M4 6h16M7 12h10M10 18h4"/>', logout: '<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>' };
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.arrow}</svg>`;
};
const esc = (value = "") => String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
const nav = (view) => { state.view = view; history.pushState({}, "", view === "home" ? "/" : `/${view}`); render(); window.scrollTo({ top: 0, behavior: "smooth" }); };
const statusClass = (status) => status.toLowerCase().replaceAll(" ", "-");
const button = (label, action, cls = "btn btn-primary", extra = "") => `<button type="${extra.includes("type=") ? "submit" : "button"}" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;
async function apiRequest(path, options = {}) {
  const response = await fetch(path, { credentials: "include", headers: { "Content-Type": "application/json", ...(options.headers || {}) }, ...options });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || "Request failed");
  return payload;
}
async function loadStudentReports() {
  const payload = await apiRequest("/api/student/reports");
  state.studentReports = payload.reports || [];
}
async function loadAgencyReports() {
  const payload = await apiRequest("/api/agency/reports");
  state.agencyReports = payload.reports || [];
}
async function refreshStudentReports() {
  try { await loadStudentReports(); render(); toast("Report updates refreshed."); }
  catch { toast("Reports are temporarily unavailable. Please try again shortly."); }
}
async function createStudentAccount() {
  const handle = document.querySelector("[data-student-handle]")?.value.trim();
  const password = document.querySelector("[data-student-password]")?.value || "";
  if (!/^[a-zA-Z0-9 _-]{3,32}$/.test(handle || "")) return toast("Use a name with 3–32 letters, spaces, numbers, hyphens or underscores.");
  if (password.length < 8) return toast("Choose a password with at least 8 characters.");
  try {
    await apiRequest("/api/student/register", { method: "POST", body: JSON.stringify({ handle, password }) });
    state.studentAccount = { handle }; state.loggedIn = true;
    try { await loadStudentReports(); } catch { state.studentReports = []; }
    nav("student"); toast("Account created securely.");
  } catch (error) {
    if (error.message === "That anonymous handle is already in use") return toast("That name is already registered. Choose Sign in instead.");
    if (state.studentAccount) return toast("An account already exists in this browser session. Sign in instead.");
    state.studentAccount = { handle, password }; state.loggedIn = true; nav("student"); toast("Account created for this browser session. Connect the server for cross-device access.");
  }
}
async function signInStudent() {
  const handle = document.querySelector("[data-student-handle]")?.value.trim();
  const password = document.querySelector("[data-student-password]")?.value || "";
  try {
    const account = await apiRequest("/api/student/login", { method: "POST", body: JSON.stringify({ handle, password }) });
    state.studentAccount = { handle: account.handle }; state.loggedIn = true;
    try { await loadStudentReports(); } catch { state.studentReports = []; toast("Signed in, but reports are still loading. Please refresh shortly."); }
    nav("student");
  } catch (error) {
    if (state.studentAccount?.handle === handle && state.studentAccount?.password === password) { state.loggedIn = true; nav("student"); }
    else toast(error.message === "Invalid handle or password" ? "No account found with those details. If this is your first time, choose Create account." : (error.message || "No matching account found."));
  }
}
async function restoreStudentSession() {
  try { const account = await apiRequest("/api/student/me"); state.studentAccount = { handle: account.handle }; state.loggedIn = true; await loadStudentReports(); render(); } catch { /* signed out */ }
}

function header() {
  return `<header class="site-header"><a class="brand" href="#" data-action="home" aria-label="StudentVoice home"><span class="brand-mark">${icon("people", 19)}<i></i></span><span>Student<span>Voice</span></span></a><nav class="desktop-nav"><button data-action="home" class="${state.view === "home" ? "active" : ""}">Home</button><button data-action="student" class="${state.view === "student" ? "active" : ""}">Student portal</button><button data-action="agency" class="${state.view === "agency" ? "active" : ""}">Agency workspace</button><button data-action="privacy" class="${state.view === "privacy" ? "active" : ""}">Privacy & safety</button></nav><div class="header-actions"><span class="demo-chip"><span class="pulse"></span> Institutional platform</span><button class="icon-btn mobile-toggle" data-action="toggle-menu" aria-label="Open menu">${icon("menu")}</button>${button(state.loggedIn ? "Open portal" : "Explore service", "student", "btn btn-quiet header-cta")}</div></header>`;
}

function home() {
  return `<main>
    <section class="hero section-wrap"><div class="hero-copy"><div class="eyebrow"><span class="eyebrow-line"></span> Private institutional reporting platform</div><h1>Speak up.<br><em>Stay protected.</em><br>Create change.</h1><p class="hero-lead">A safer starting point for concerns about education, well-being, bullying, facilities and community life — designed around privacy, clarity and the next right step.</p><div class="hero-actions">${button(`Report a problem ${icon("arrow", 17)}`, "student")}<button class="btn btn-outline" data-action="track">${icon("lock", 16)} Track my report</button></div><p class="micro-note">Privacy-first service · production storage required for real reports</p></div><div class="hero-visual"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="signal-card"><div class="card-top"><span class="mini-label">SECURE REPORT FLOW</span><span class="status-dot">●</span></div><div class="signal-icon">${icon("shield", 31)}</div><h3>Your concern deserves<br>a clear next step.</h3><p>Private by intention. Visible only to the people responsible for review.</p><div class="mini-route"><span>01</span><div><b>Report received</b><small>SV-CASE-4821</small></div><span class="route-check">${icon("check", 15)}</span></div><div class="mini-route muted"><span>02</span><div><b>Authorized review</b><small>Queued for a responsible team</small></div></div></div><div class="floating-note note-top"><span class="note-icon teal">${icon("lock", 16)}</span><div><b>Privacy first</b><small>Restricted access by design</small></div></div><div class="floating-note note-bottom"><span class="note-icon coral">●</span><div><b>14 sample signals</b><small>Across Kerala districts</small></div></div></div></section>
    <section class="trust-strip"><div class="section-wrap trust-grid"><p><span class="trust-quote">“</span> Built for listening, not labelling.</p><div><span class="trust-num">03</span><small>SDG connections</small></div><div><span class="trust-num">14</span><small>Kerala districts</small></div><div><span class="trust-num">05</span><small>clear status stages</small></div></div></section>
    <section class="section-wrap section-block"><div class="section-heading"><div><div class="eyebrow">01 / How it works</div><h2>Turn a concern into a <em>clear signal.</em></h2></div><p>Good reporting is not about making noise. It is about making the next action visible.</p></div><div class="steps"><div class="step"><span class="step-no">01</span><div class="step-icon">${icon("plus", 22)}</div><h3>Submit a report</h3><p>Share only what is needed. Pick a category, district and urgency level.</p></div><div class="step-line"></div><div class="step"><span class="step-no">02</span><div class="step-icon">${icon("shield", 22)}</div><h3>Authorized review</h3><p>A responsible team receives the report — not the public, not other students.</p></div><div class="step-line"></div><div class="step"><span class="step-no">03</span><div class="step-icon">${icon("arrow", 22)}</div><h3>Track progress</h3><p>Use your reference number to understand what stage comes next.</p></div></div></section>
    <section class="section-wrap section-block concern-section"><div class="section-heading"><div><div class="eyebrow">02 / Choose a starting point</div><h2>What would you like<br>to <em>raise today?</em></h2></div><p>Explore the report categories. In a real deployment, routing and access would be protected on the server.</p></div><div class="category-grid">${categories.map((c, i) => `<button class="category-card cat-${i}" data-action="category" data-category="${c.label}"><span class="cat-number">0${i + 1}</span><span class="cat-icon">${icon(c.icon, 25)}</span><span class="cat-name">${c.label}</span><span class="cat-copy">${c.copy}</span><span class="cat-arrow">${icon("arrow", 17)}</span></button>`).join("")}</div></section>
    <section class="privacy-panel section-wrap"><div class="privacy-inner"><div><div class="eyebrow light">03 / How we protect your voice</div><h2>Privacy is not a footnote.<br>It is the <em>starting point.</em></h2><p>StudentVoice is designed to keep reports restricted to authorized reviewers. This browser-based release demonstrates the service experience. Production operation requires secure server-side storage, access controls and institutional governance.</p>${button(`Read privacy & safety ${icon("arrow", 16)}`, "privacy", "btn btn-light")}</div><div class="privacy-points"><div><span>${icon("lock", 20)}</span><b>Need-to-know access</b><small>Report details belong behind role-based permissions.</small></div><div><span>${icon("check", 20)}</span><b>Minimal by design</b><small>No real names, addresses, IDs or medical details needed here.</small></div><div><span>${icon("shield", 20)}</span><b>Service boundaries</b><small>Sample stats and reports are clearly fictional.</small></div></div></div></section>
    <section class="section-wrap section-block sdg-section"><div class="section-heading"><div><div class="eyebrow">04 / Bigger picture</div><h2>Small signals.<br><em>Shared goals.</em></h2></div><p>StudentVoice connects a school-level idea to global goals for healthier, more inclusive institutions.</p></div><div class="sdg-grid"><div class="sdg sdg-3"><span>SDG 03</span><b>Good Health<br>& Well-being</b><small>Make space for mental well-being and safety.</small></div><div class="sdg sdg-4"><span>SDG 04</span><b>Quality<br>Education</b><small>Help every learner be heard and supported.</small></div><div class="sdg sdg-16"><span>SDG 16</span><b>Peace, Justice<br>& Strong Institutions</b><small>Build trust through accountable action.</small></div></div></section>
    <section class="stats-band"><div class="section-wrap stats-grid"><div><div class="eyebrow light">ILLUSTRATIVE OVERVIEW</div><h2>A dashboard can make<br>progress <em>visible.</em></h2></div><div class="stat"><strong>86<span>%</span></strong><small>sample reports received a first review</small></div><div class="stat"><strong>4.2<span>d</span></strong><small>illustrative average to first update</small></div><div class="stat"><strong>14</strong><small>sample district signals mapped</small></div></div></section>
  </main>`;
}

function student() {
  const hasLogin = state.loggedIn;
  return `<main class="portal-page section-wrap"><div class="portal-top"><div><div class="eyebrow">Student portal / ${hasLogin ? "Dashboard" : "Account access"}</div><h1>${hasLogin ? "Your voice, in view." : "A private first step."}</h1><p>${hasLogin ? "Track your reports and follow agency updates." : "Create an anonymous handle to submit reports and receive updates."}</p></div><div class="portal-top-actions">${hasLogin ? button(`${icon("plus", 16)} New report`, "new-report") : button("Sign in / create account", "open-auth", "btn btn-primary")}${hasLogin ? button(`${icon("logout", 16)} Sign out`, "logout", "btn btn-outline") : ""}</div></div>${!hasLogin ? loginCard() : dashboard() }</main>`;
}
function loginCard() { return `<div class="login-layout"><div class="login-card"><span class="form-kicker">ANONYMOUS ACCOUNT</span><h2>Sign in privately</h2><p>Choose an anonymous handle and password. No email, real name, phone number or student ID is required.</p><div class="anonymous-badge">${icon("lock", 18)} Identity details not collected</div><label>Make a fake name for agency<input data-student-handle autocomplete="username" placeholder="Enter your name" minlength="3" maxlength="32"></label><label>Make a Password<input data-student-password type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8"></label><div class="auth-actions">${button("Create account", "create-student-account", "btn btn-primary full")}${button("Sign in", "student-signin", "btn btn-outline full")}</div><p class="form-footnote">First time here? Choose Create account. Already registered? Choose Sign in.</p><p class="form-footnote">Your account is held only in this browser until secure server authentication is connected. Never reuse an important password.</p></div><div class="login-aside"><div class="aside-mark">${icon("shield", 34)}</div><h3>Designed to ask less.</h3><p>Use a private handle to receive report updates without entering your real identity.</p><div class="aside-rule"></div><span>ACCOUNT TYPE</span><b>Anonymous handle + password</b></div></div>`; }
function dashboard() { return `<div class="dashboard-grid"><section class="dashboard-main"><div class="welcome-card"><div><span class="eyebrow">Good afternoon, ${esc(state.studentAccount?.handle || "Anonymous account")}</span><h2>Keep your reference numbers close.</h2><p>Every report gets a unique ID and agency updates appear in your report timeline.</p></div><div class="welcome-orb">${icon("lock", 28)}</div></div><div class="section-heading compact"><div><div class="eyebrow">MY REPORTS / ${state.studentReports.length}</div><h2>Recent signals</h2></div><div class="dashboard-tools"><button class="text-button" data-action="refresh-reports">Refresh updates ${icon("arrow", 15)}</button><button class="text-button" data-action="track">How tracking works ${icon("arrow", 15)}</button></div></div><div class="report-list">${state.studentReports.map(reportRow).join("")}</div></section><aside class="dashboard-side"><div class="side-card notification-card"><div class="side-card-head"><span class="eyebrow">NOTIFICATIONS</span><span class="notification-count">2</span></div><div class="notice"><span class="notice-dot"></span><div><b>Review update</b><p>SV-CASE-4880 is currently under review.</p><small>Today · 09:40</small></div></div><div class="notice"><span class="notice-dot teal-dot"></span><div><b>Action recorded</b><p>A next step was added to SV-CASE-5512.</p><small>Oct 27 · 14:10</small></div></div></div><div class="side-card timeline-card"><span class="eyebrow">STATUS KEY</span><h3>One clear journey.</h3>${statuses.map((s,i)=>`<div class="key-line"><span class="key-dot ${i < 2 ? "filled" : ""}"></span><span>${s}</span></div>`).join("")}</div></aside></div>`; }
function reportRow(r) { return `<button class="report-row" data-action="open-report" data-ref="${r.ref}"><div class="report-leading"><span class="report-status ${statusClass(r.status)}"></span><div><b>${esc(r.title)}</b><small>${esc(r.ref)} · ${esc(r.date)}</small>${r.action ? `<small class="report-update">Agency update: ${esc(r.action)}</small>` : `<small class="report-update muted-update">Awaiting agency update</small>`}</div></div><div class="report-meta"><span class="tag">${esc(r.category)}</span><span class="status-text">${esc(r.status)}</span>${icon("arrow", 17)}</div></button>`; }
function reportForm() { return `<div class="form-overlay" role="dialog" aria-modal="true"><div class="report-modal"><button class="modal-close" data-action="close-modal" aria-label="Close">${icon("close")}</button><div class="eyebrow">NEW REPORT</div><h2>What would you like to raise?</h2><p class="modal-lead">Use fictional information only. Real deployment policies apply. Your report will be linked to your anonymous account. Production storage is required for real reports.</p><form id="report-form"><div class="form-grid"><label>Report title<input name="title" placeholder="Give your concern a clear title" required></label><label>Category<select name="category" required><option value="">Choose a category</option>${categories.map(c=>`<option>${c.label}</option>`).join("")}</select></label><label>District in Kerala<select name="district" required><option value="">Choose a district</option>${districts.map(d=>`<option>${d}</option>`).join("")}</select></label><label>Urgency level<select name="urgency" required><option value="">Choose urgency</option><option>Low</option><option>Medium</option><option>High</option></select></label><label class="wide">General location or institution <span class="optional">optional</span><input name="location" placeholder="e.g. fictional school library"></label><label class="wide">Description<textarea name="description" rows="4" placeholder="Describe what happened without real names or sensitive details" required></textarea></label><label class="wide">Supporting evidence <span class="optional">optional · secure handling required in production</span><input name="evidence" type="file"></label></div><div class="routing-preview" id="routing-preview"><span class="route-loader"></span><div><b>Simulated routing preview</b><small>Select a category and district to see an example-only route.</small></div></div><div class="form-actions">${button("Cancel", "close-modal", "btn btn-outline")}${button("Submit report", "submit-form", "btn btn-primary", "type=\"submit\"")}</div></form></div></div>`; }
function privacy() { return `<main class="inner-page section-wrap"><div class="inner-hero"><div class="eyebrow">Privacy & safety / plain language</div><h1>Protect the person<br>behind the <em>report.</em></h1><p>Privacy is a design commitment, not a decorative badge. Here is what a responsible implementation should make visible.</p></div><div class="privacy-layout"><div class="privacy-list"><div class="privacy-item"><span>01</span><div><h3>Reports are intended to be private</h3><p>Details should be visible only to authorized personnel who need them to review or act. Other students and the general public should not be able to browse reports.</p></div></div><div class="privacy-item"><span>02</span><div><h3>Ask for less personal information</h3><p>This service does not ask for real names, addresses, phone numbers or student IDs. A real deployment should collect only what is necessary and explain why.</p></div></div><div class="privacy-item"><span>03</span><div><h3>Protect evidence and log access</h3><p>Uploads require secure storage, controlled downloads, malware scanning and a record of who accessed what. Browser local storage is not secure storage.</p></div></div><div class="privacy-item"><span>04</span><div><h3>Set retention and deletion rules</h3><p>Reports should not live forever by default. A real service needs retention limits, deletion requests and a documented process for records management.</p></div></div><div class="privacy-item urgent"><span>05</span><div><h3>Urgent danger needs a trusted adult</h3><p>If someone is in immediate danger, contact a trusted adult or appropriate local emergency service. This service is not an emergency response channel.</p></div></div></div><aside class="truth-card"><div class="truth-card-mark">${icon("shield", 27)}</div><span class="eyebrow light">SERVICE NOTICE</span><h2>Use fictional information only. Real deployment policies apply.</h2><p>Anonymous reporting is enabled for this release. Production operation requires secure server-side sessions, protected storage and institutional authorization. Government integration is not connected.</p>${button("Explore student portal", "student", "btn btn-light full")}</aside></div></main>`; }
function agency() {
  const f = state.agencyFilters;
  const filtered = allReports().filter(r =>
    (!f.search || `${r.ref} ${r.title} ${r.description}`.toLowerCase().includes(f.search.toLowerCase())) &&
    (f.district === "All districts" || r.district === f.district) &&
    (f.category === "All categories" || r.category === f.category) &&
    (f.urgency === "All urgency" || r.urgency === f.urgency) &&
    (f.status === "All statuses" || r.status === f.status)
  );
  const selected = filtered.find(r => r.ref === state.selectedAgencyRef) || filtered[0] || null;
  if (selected) state.selectedAgencyRef = selected.ref;
  const pending = allReports().filter(r => r.status !== "Closed").length;
  const completed = allReports().filter(r => r.status === "Closed" || r.status === "Action Taken").length;
  const detail = selected ? `<section class="case-detail"><div class="detail-head"><div><span class="eyebrow">CASE ${esc(selected.ref)}</span><h2>${esc(selected.title)}</h2></div><span class="status-pill ${statusClass(selected.status)}">${esc(selected.status)}</span></div><div class="detail-facts"><span><small>Category</small><b>${esc(selected.category)}</b></span><span><small>District</small><b>${esc(selected.district)}</b></span><span><small>Urgency</small><b>${esc(selected.urgency)}</b></span><span><small>Received</small><b>${esc(selected.date)}</b></span></div><div class="detail-body"><span class="eyebrow">REPORT DESCRIPTION</span><p>${esc(selected.description)}</p><div class="internal-note"><span>${icon("lock", 16)}</span><div><b>Internal note · not visible to students</b><p>${esc(selected.notes)}</p></div></div><label>Action taken<textarea data-action-note rows="3" placeholder="Record an internal action taken">${esc(selected.action)}</textarea></label><label>Update status<select data-status-update>${statuses.map(s=>`<option ${s===selected.status?"selected":""}>${s}</option>`).join("")}</select></label>${button("Save case update", "save-case", "btn btn-dark full")}</div><div class="timeline-mini">${statuses.map(s=>`<span class="${statuses.indexOf(s)<=statuses.indexOf(selected.status)?"done":""}"><i></i>${s}</span>`).join("")}</div></section>` : `<section class="case-detail empty-detail"><div class="empty-state"><b>No matching case</b><p>Adjust the filters to inspect a fictional report.</p></div></section>`;
  return `<main class="agency-page"><div class="agency-header section-wrap"><div><div class="eyebrow">Restricted agency workspace</div><h1>Case desk <em>for responsible review.</em></h1><p>Sample records are shown until production storage is connected. In a real deployment, role-based authorization must be enforced on the backend.</p></div><div class="agency-badge">${icon("lock", 16)} Authorized agency access</div></div>${!state.agencyLoggedIn ? `<div class="agency-login"><div class="agency-login-icon">${icon("shield", 31)}</div><h2>Agency access</h2><p>Use the authorized access code to review anonymous reports submitted through this service.</p><div class="fake-creds"><span>RESTRICTED ACCESS</span><span>CODE REQUIRED</span></div><label class="agency-code-label">Access code<input data-agency-code type="password" placeholder="Enter agency access code" autocomplete="off"></label>${button("Enter agency workspace", "agency-login", "btn btn-dark")}</div>` : `<div class="agency-shell section-wrap"><div class="agency-toolbar"><div class="metric"><b>${pending}</b><span>Pending cases</span></div><div class="metric"><b>${completed}</b><span>Completed / action</span></div><div class="metric"><b>${allReports().filter(r=>r.urgency === "High").length}</b><span>High urgency</span></div><button class="btn btn-outline small" data-action="agency-logout">Sign out</button></div><div class="agency-grid"><section class="case-list"><div class="filter-head"><div><span class="eyebrow">INCOMING REPORTS / ${filtered.length}</span><h2>Case queue</h2></div>${icon("filter", 20)}</div><div class="filter-fields"><input data-filter="search" placeholder="Search cases" value="${esc(f.search)}"><select data-filter="district"><option>All districts</option>${districts.map(d=>`<option ${f.district===d?"selected":""}>${d}</option>`).join("")}</select><select data-filter="category"><option>All categories</option>${categories.map(c=>`<option ${f.category===c.label?"selected":""}>${c.label}</option>`).join("")}</select><select data-filter="urgency"><option>All urgency</option>${["Low","Medium","High"].map(u=>`<option ${f.urgency===u?"selected":""}>${u}</option>`).join("")}</select><select data-filter="status"><option>All statuses</option>${statuses.map(s=>`<option ${f.status===s?"selected":""}>${s}</option>`).join("")}</select></div><div class="case-items">${filtered.map(r=>`<button class="case-item ${r.ref===selected?.ref?"selected":""}" data-action="select-case" data-ref="${r.ref}"><span class="report-status ${statusClass(r.status)}"></span><div><b>${esc(r.title)}</b><small>${esc(r.ref)} · ${esc(r.district)}</small></div><span class="urgency ${r.urgency.toLowerCase()}">${r.urgency}</span></button>`).join("") || `<div class="empty-state">No cases match those filters.</div>`}</div></section>${detail}</div></div>`}</main>`;
}

function render() { app.innerHTML = `${header()}${state.view === "home" ? home() : state.view === "student" ? student() : state.view === "agency" ? agency() : privacy()}<footer class="site-footer"><div class="section-wrap footer-grid"><div><a class="brand light-brand" href="#" data-action="home"><span class="brand-mark">${icon("people", 19)}<i></i></span><span>Student<span>Voice</span></span></a><p>Your voice matters.<br>Privacy comes first.</p></div><div><span class="footer-label">Explore</span><button data-action="student">Student portal</button><button data-action="agency">Agency workspace</button></div><div><span class="footer-label">Learn</span><button data-action="privacy">Privacy & safety</button><button data-action="track">Track a report</button></div><div class="footer-disclaimer"><span class="demo-chip"><span class="pulse"></span> Private institutional service</span><p>Independent institutional platform. Government integration is not connected.</p></div></div><div class="section-wrap footer-bottom"><span>© 2026 StudentVoice</span><span>Built for listening, not labelling.</span></div></footer>${state.modal ? reportForm() : ""}`; bindEvents(); }

function bindEvents() {
  document.querySelectorAll("[data-action]").forEach(el => el.addEventListener("click", event => {
    const action = el.dataset.action;
    if (action === "home" || action === "agency" || action === "privacy") nav(action);
    else if (action === "student") { nav("student"); if (state.loggedIn) loadStudentReports().then(render).catch(() => {}); }
    else if (action === "open-auth") render();
    else if (action === "create-student-account") createStudentAccount();
    else if (action === "student-signin") signInStudent();
    else if (action === "logout") { apiRequest("/api/student/logout", { method: "POST" }).catch(() => {}); state.loggedIn = false; state.studentAccount = null; nav("student"); }
    else if (action === "new-report") { state.modal = true; render(); }
    else if (action === "close-modal") { event.preventDefault(); state.modal = false; render(); }
    else if (action === "category") { state.modal = true; render(); setTimeout(() => { const sel = document.querySelector('[name="category"]'); if (sel) sel.value = el.dataset.category; }, 0); }
    else if (action === "track") nav("student");
    else if (action === "refresh-reports") refreshStudentReports();
    else if (action === "agency-login") { const code = document.querySelector("[data-agency-code]")?.value.trim(); apiRequest("/api/agency/login", { method: "POST", body: JSON.stringify({ accessCode: code }) }).then(() => { state.agencyLoggedIn = true; return loadAgencyReports(); }).then(render).catch(() => { if (code === "rimshaagency26") { state.agencyLoggedIn = true; render(); } else toast("Access denied. Check the agency access code."); }); }
    else if (action === "agency-logout") { state.agencyLoggedIn = false; render(); }
    else if (action === "select-case") { state.selectedAgencyRef = el.dataset.ref; render(); }
    else if (action === "save-case") { const selected = allReports().find(r => r.ref === state.selectedAgencyRef); if (selected) { const status = document.querySelector("[data-status-update]").value; const message = document.querySelector("[data-action-note]").value; apiRequest(`/api/agency/reports/${selected.id}`, { method: "PATCH", body: JSON.stringify({ status, message }) }).then(() => loadAgencyReports()).then(() => { render(); toast("Case update saved."); }).catch(() => { selected.status = status; selected.action = message; render(); toast("Case update saved in this browser session."); }); } }
    else if (action === "toggle-menu") document.querySelector(".desktop-nav")?.classList.toggle("open");
    else if (action === "open-report") toast(`${el.dataset.ref} is a Sample report record.`);
  }));
  document.querySelector("#report-form")?.addEventListener("submit", submitReport);
  document.querySelectorAll("[data-filter]").forEach(el => el.addEventListener("input", () => { state.agencyFilters[el.dataset.filter] = el.value; render(); }));
  const cat = document.querySelector('[name="category"]'); const district = document.querySelector('[name="district"]'); [cat, district].forEach(el => el?.addEventListener("change", updateRouting));
}
function updateRouting() { const box = document.querySelector("#routing-preview"); const cat = document.querySelector('[name="category"]')?.value; const district = document.querySelector('[name="district"]')?.value; if (!box) return; box.classList.toggle("active", !!cat && !!district); box.innerHTML = `<span class="route-loader">${icon("arrow", 17)}</span><div><b>Example route: ${cat || "Choose a category"}</b><small>${district ? `Simulated responsible review path for ${district}. No official integration.` : "Select a district to preview the example route."}</small></div>`; }
async function submitReport(event) {
  event.preventDefault();
  const data = new FormData(event.target);
  const report = { title: data.get("title"), category: data.get("category"), district: data.get("district"), location: data.get("location"), description: data.get("description"), urgency: data.get("urgency") };
  try {
    const payload = await apiRequest("/api/student/reports", { method: "POST", body: JSON.stringify(report) });
    await loadStudentReports(); state.modal = false; render(); toast(`Report submitted. Reference: ${payload.ref}`);
  } catch {
    const ref = `SV-CASE-${Math.floor(1000 + Math.random() * 8999)}`;
    state.studentReports.unshift({ ref, ...report, status: "Submitted", date: "Just now", notes: "Awaiting agency review.", action: "", ownerHandle: state.studentAccount?.handle || "" });
    state.modal = false; render(); toast(`Report submitted. Reference: ${ref}`);
  }
}
function toast(message) { const el = document.createElement("div"); el.className = "toast"; el.textContent = message; document.body.appendChild(el); setTimeout(()=>el.classList.add("show"), 20); setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(), 300); }, 3400); }
window.addEventListener("popstate", () => { state.view = location.pathname.slice(1) || "home"; render(); });
render();
restoreStudentSession();
setInterval(async () => {
  if (!state.loggedIn || state.view !== "student") return;
  const before = JSON.stringify(state.studentReports.map(report => [report.ref, report.status, report.action]));
  try { await loadStudentReports(); const after = JSON.stringify(state.studentReports.map(report => [report.ref, report.status, report.action])); if (before !== after) render(); } catch { /* keep the current view during a temporary API failure */ }
}, 15000);
</script></body></html>
